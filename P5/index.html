<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Store Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Pet Store Manager</h1>
        <p>Manage your pets easily</p>
    </header>

    <main>
        <section class="form-section">
            <h2 id="form-title">Add a New Pet</h2>

            <form id="pet-form">
                <label for="name">Pet Name</label>
                <input type="text" id="name" required>

                <label for="description">Description</label>
                <input type="text" id="description">

                <label for="image">Image URL</label>
                <input type="url" id="image" required
                       placeholder="https://example.com/cat.jpg">

                <label for="birthdate">Birthdate</label>
                <input type="date" id="birthdate" required>

                <label for="price">Price (€)</label>
                <input type="number" id="price" min="0.01"
                       step="0.01" required>

                <label for="code">Pet Code</label>
                <input type="text" id="code"
                       placeholder="CAT123"
                       pattern="[A-Za-z]{3}[0-9]{3}"
                       title="Three letters followed by three numbers"
                       required>

                <label class="checkbox-label" for="sold">
                    <input type="checkbox" id="sold">
                    Sold
                </label>

                <div class="form-buttons">
                    <button type="submit" id="submit-button">
                        Add Pet
                    </button>

                    <button type="button" id="cancel-button"
                            class="secondary hidden">
                        Cancel
                    </button>
                </div>

                <p id="message" role="alert"></p>
            </form>
        </section>

        <section class="pets-section">
            <h2>Pet List</h2>
            <p id="pet-count">0 pets</p>
            <div id="pet-list" class="pet-list"></div>
        </section>
    </main>

    <footer>
        <p>Pet Store Manager 2026</p>
    </footer>
</body>
</html>
